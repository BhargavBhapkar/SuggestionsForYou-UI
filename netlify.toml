# Netlify settings for the SuggestionsForYou website (the React/Vite UI only).
# The API is a separate server and is NOT deployed by this file.
#
# Set these in Netlify > Site configuration > Environment variables, then redeploy:
#   VITE_API_URL     the public URL of the deployed API, ending in /api
#   ALLOW_INDEXING   leave unset (or false) until you want search engines to index the site

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every address is served by index.html and the router takes over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The offline worker and the HTML shell must always be re-checked, or users get stale builds.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Built files have content hashes in their names, so they can be cached for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
